<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Proyección · BodaLive</title>
<meta name="theme-color" content="#F8F5F0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
  :root {
    --bg: #F8F5F0;
    --surface: #FFFFFF;
    --green: #2D4A3E;
    --green-dark: #1A2E28;
    --text: #1A2E28;
    --text-soft: #7A9088;
    --gold: #C9A96E;
    --line: #E8E0D8;
    --placeholder: #EFEAE2;
    --placeholder-icon: #CFC6BA;
    --spring: cubic-bezier(0.34, 1.56, 0.64, 1);
    --fade-ms: 500ms;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', -apple-system, 'Segoe UI', sans-serif;
    -webkit-font-smoothing: antialiased;
    cursor: none;
  }

  .shell { position: absolute; inset: 0; display: flex; flex-direction: column; }

  /* ---------- Header ---------- */
  .header {
    flex: none;
    display: grid; grid-template-columns: 1fr auto 1fr; align-items: center;
    padding: 18px 28px 14px;
  }
  .logo { font-size: 14px; font-weight: 500; color: var(--green); letter-spacing: 0.2px; }
  .header-center { text-align: center; }
  .names {
    font-size: 18px; font-weight: 400; letter-spacing: 4px;
    text-transform: uppercase; color: var(--text); white-space: nowrap;
  }
  .date { font-size: 11px; color: var(--text-soft); letter-spacing: 2px; margin-top: 4px; min-height: 14px; }
  .header-right { display: flex; align-items: center; justify-content: flex-end; gap: 14px; }
  .tagline { font-size: 13px; font-style: italic; color: var(--text-soft); }
  .mode-badge {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 10px; font-weight: 500; letter-spacing: 0.5px; color: var(--green);
    border: 1px solid var(--line); background: var(--surface);
    border-radius: 99px; padding: 4px 10px;
  }
  .mode-badge svg { width: 12px; height: 12px; }

  /* ---------- Mosaico ---------- */
  .mosaic {
    flex: 1; min-height: 0;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    grid-template-rows: repeat(3, 1fr);
    grid-template-areas:
      "a c c e"
      "a c c g"
      "b d f h";
    gap: 10px;
    padding: 0 28px 14px;
  }
  .cell { position: relative; overflow: hidden; border-radius: 6px; background: var(--placeholder); min-width: 0; min-height: 0; }
  .cell-a { grid-area: a; }
  .cell-b { grid-area: b; }
  .cell-c { grid-area: c; }
  .cell-d { grid-area: d; }
  .cell-e { grid-area: e; }
  .cell-f { grid-area: f; }
  .cell-g { grid-area: g; }
  .cell-h { grid-area: h; }

  /* Placeholder sutil para posiciones sin foto */
  .placeholder {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    color: var(--placeholder-icon);
  }
  .placeholder svg { width: 28px; height: 28px; }

  /* Capas de foto: la nueva entra encima con resorte, la vieja se desvanece */
  .layer {
    position: absolute; inset: 0;
    opacity: 0; transform: scale(0.96);
    transition: opacity 700ms var(--spring), transform 700ms var(--spring);
  }
  .layer.in { opacity: 1; transform: scale(1); }
  .layer.out { opacity: 0; transform: scale(1); transition: opacity 300ms ease; }
  .layer img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .guest-name {
    position: absolute; left: 8px; bottom: 8px;
    font-size: 10px; font-weight: 500; letter-spacing: 0.5px;
    color: rgba(255,255,255,0.95);
    background: rgba(26,46,40,0.4);
    border-radius: 99px; padding: 3px 8px;
    max-width: calc(100% - 16px);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }

  /* C: foto fija de los novios */
  .cover img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .cover-fallback {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    font-family: Georgia, 'Times New Roman', serif; font-style: italic;
    font-size: 40px; color: var(--green);
  }

  /* D: frase sobre la foto */
  .quote {
    position: absolute; inset: 0; z-index: 2; pointer-events: none;
    display: flex; align-items: center; justify-content: center; text-align: center;
    padding: 16px;
    background: linear-gradient(to top, rgba(26,46,40,0.45), rgba(26,46,40,0.15));
    font-family: Georgia, 'Times New Roman', serif; font-style: italic;
    font-size: 20px; line-height: 1.3; color: #fff;
    text-shadow: 0 1px 6px rgba(0,0,0,0.3);
  }

  /* Badge de votos (H y estrella) */
  .votes-badge {
    display: inline-flex; align-items: center; gap: 4px;
    font-size: 11px; font-weight: 500;
    border-radius: 99px; padding: 4px 10px;
  }
  .cell-h .votes-badge {
    position: absolute; top: 10px; right: 10px; z-index: 2;
    background: rgba(255,255,255,0.92); color: var(--text);
  }

  /* G: estrella de la noche */
  .star {
    background: var(--green-dark); color: #fff;
    display: flex; flex-direction: column; justify-content: center;
    padding: 20px 22px;
  }
  .star-title { font-size: 9px; font-weight: 600; letter-spacing: 2px; color: var(--gold); text-transform: uppercase; margin-bottom: 12px; }
  .star-name {
    font-family: Georgia, 'Times New Roman', serif; font-style: italic;
    font-size: 16px; color: #fff; margin-bottom: 4px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .star-points { font-size: 13px; font-weight: 500; color: var(--gold); margin-bottom: 14px; }
  .star .votes-badge { align-self: flex-start; background: rgba(255,255,255,0.08); color: rgba(255,255,255,0.85); }

  /* ---------- Footer ---------- */
  .footer {
    flex: none;
    display: flex; justify-content: space-between; align-items: center;
    background: var(--surface); border-top: 1px solid var(--line);
    padding: 10px 28px;
    font-size: 12px; color: var(--text-soft);
    font-variant-numeric: tabular-nums;
  }

  /* ---------- Foto del momento ---------- */
  #momentLayer {
    position: absolute; inset: 0; z-index: 5;
    display: flex; flex-direction: column; align-items: center;
    padding: 28px 28px 32px;
    background: rgba(248,245,240,0.94);
    -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
    opacity: 0; pointer-events: none;
    transition: opacity var(--fade-ms) ease;
  }
  body.moment-on #momentLayer { opacity: 1; }
  .moment-eyebrow {
    font-size: 11px; font-weight: 500; letter-spacing: 4px;
    text-transform: uppercase; color: var(--text-soft); margin-bottom: 6px;
  }
  .moment-countdown {
    font-size: 56px; font-weight: 300; line-height: 1.1; color: var(--green);
    margin-bottom: 14px; font-variant-numeric: tabular-nums;
  }
  .moment-result {
    font-family: Georgia, 'Times New Roman', serif; font-style: italic;
    font-size: 30px; color: var(--text); margin: 12px 0 18px;
  }
  .moment-photo-box {
    width: 60%; flex: 1; min-height: 0;
    border-radius: 6px; overflow: hidden; background: var(--placeholder);
    box-shadow: 0 20px 60px rgba(26,46,40,0.18);
  }
  .moment-photo-box img { width: 100%; height: 100%; object-fit: contain; display: block; }
  .moment-bars { width: 60%; margin-top: 22px; }
  .bar-row { display: flex; align-items: center; margin-bottom: 10px; gap: 14px; }
  .bar-label { flex: 0 0 140px; font-size: 14px; font-weight: 500; color: var(--text); }
  .track { flex: 1; height: 8px; border-radius: 99px; background: var(--line); overflow: hidden; }
  .fill { height: 100%; border-radius: 99px; transition: width 0.4s ease; }
  .fill-like { background: var(--green); }
  .fill-meh { background: #C9C2B8; }
  .bar-value { flex: 0 0 100px; text-align: right; font-size: 14px; font-weight: 600; color: var(--text); font-variant-numeric: tabular-nums; }
  .moment-total { text-align: center; font-size: 12px; color: var(--text-soft); margin-top: 6px; }

  /* Emojis flotantes */
  .emoji-layer { position: absolute; inset: 0; z-index: 6; pointer-events: none; overflow: hidden; }
  .floating-emoji {
    position: absolute; bottom: 40px; font-size: 48px;
    animation: floatUp 3s ease-out forwards;
  }
  @keyframes floatUp {
    0% { transform: translateY(0); opacity: 1; }
    70% { opacity: 1; }
    100% { transform: translateY(-60vh); opacity: 0; }
  }

  /* Mensajes de estado */
  .notice {
    position: absolute; inset: 0; z-index: 10;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 32px; text-align: center; background: var(--bg);
  }
  .notice-icon { font-size: 44px; margin-bottom: 16px; }
  .notice-text { color: var(--text-soft); font-size: 15px; line-height: 1.5; max-width: 420px; }
  .hidden { display: none !important; }

  #rotateNotice { display: none; }
  @media (orientation: portrait) {
    #rotateNotice { display: flex; }
  }
</style>
</head>
<body>

<div class="shell">
  <header class="header">
    <div class="logo">BodaLive</div>
    <div class="header-center">
      <div class="names" id="names">&nbsp;</div>
      <div class="date" id="date"></div>
    </div>
    <div class="header-right">
      <span class="tagline">Una noche para recordar</span>
      <span class="mode-badge">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="2" y="3" width="20" height="14" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/>
        </svg>
        Modo Proyección
      </span>
    </div>
  </header>

  <main class="mosaic">
    <div class="cell cell-a" data-slot="a"></div>
    <div class="cell cell-b" data-slot="b"></div>
    <div class="cell cell-c cover" id="coverCell">
      <div class="cover-fallback" id="coverFallback"></div>
    </div>
    <div class="cell cell-d" data-slot="d">
      <div class="quote">La vida es mejor juntos</div>
    </div>
    <div class="cell cell-e" data-slot="e"></div>
    <div class="cell cell-f" data-slot="f"></div>
    <div class="cell cell-g star">
      <div class="star-title">Estrella de la noche</div>
      <div class="star-name" id="starName">—</div>
      <div class="star-points" id="starPoints">Sumá puntos jugando</div>
      <span class="votes-badge">❤️ <span id="starVotes">0</span> votos</span>
    </div>
    <div class="cell cell-h" data-slot="h">
      <span class="votes-badge hidden" id="slotHVotes"></span>
    </div>
  </main>

  <footer class="footer">
    <span id="footerPhotos">📷 0 fotos</span>
    <span></span>
    <span id="footerVotes">❤️ 0 votos</span>
  </footer>
</div>

<div id="momentLayer">
  <div class="moment-eyebrow" id="momentEyebrow">Foto del momento · Votá desde tu celular</div>
  <div class="moment-countdown" id="momentCountdown">15</div>
  <div class="moment-result hidden" id="momentResult"></div>
  <div class="moment-photo-box"><img id="momentPhoto" alt=""></div>
  <div class="moment-bars">
    <div class="bar-row">
      <span class="bar-label">❤️ Me encanta</span>
      <div class="track"><div class="fill fill-like" id="likeFill" style="width:0%;"></div></div>
      <span class="bar-value" id="likeValue">0% · 0</span>
    </div>
    <div class="bar-row">
      <span class="bar-label">😐 Meh</span>
      <div class="track"><div class="fill fill-meh" id="mehFill" style="width:0%;"></div></div>
      <span class="bar-value" id="mehValue">0% · 0</span>
    </div>
    <div class="moment-total" id="momentTotal">0 votos recibidos</div>
  </div>
</div>

<div class="emoji-layer" id="emojiLayer"></div>

<div class="notice hidden" id="errorNotice">
  <div class="notice-icon">💍</div>
  <div class="notice-text" id="errorText"></div>
</div>

<div class="notice" id="rotateNotice">
  <div class="notice-icon">📐</div>
  <div class="notice-text">Girá el dispositivo para la vista de proyección</div>
</div>

<script>
  // ---------------- Supabase setup ----------------
  const SUPABASE_URL = 'https://htqwrnhrvvucahhlvfsc.supabase.co'
  const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imh0cXdybmhydnZ1Y2FoaGx2ZnNjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg1NTA3NzQsImV4cCI6MjEwNDEyNjc3NH0.VfEPAZx9ynVozFPUu6HAV3k2db4fy7Ye6EvDMKSG3E4'
  const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY)

  // Posiciones del mosaico que rotan con fotos de invitados (C es la foto
  // fija de los novios y G la estrella de la noche).
  const SLOT_KEYS = ['a', 'b', 'd', 'e', 'f', 'h']
  const ROTATE_MS = 9000
  const POOL_SIZE = 80
  const LEAVE_MS = 300
  const NO_TABLE = 'Sin mesa'
  const MAX_FLOATING_EMOJIS = 3
  const EMOJI_DURATION = 3000
  const MOMENT_SECONDS = 15
  const MOMENT_RESULT_MS = 5000
  const MOMENT_FADE_MS = 500
  const MOMENT_WIN_THRESHOLD = 70
  const MOMENT_WIN_POINTS = 150

  const PLACEHOLDER_HTML = `
    <div class="placeholder">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/>
      </svg>
    </div>`

  const state = {
    weddingId: null,
    // Fotos aprobadas recientes para rotar, y likes de todas para el total
    pool: [],
    poolCursor: 0,
    likesById: {},
    totalPhotos: 0,
    slots: [],
    rotateTimer: null,
    pointsRows: [],
    moment: null,
    momentPhoto: null,
    momentVotes: { likes: 0, mehs: 0 },
    momentTimer: null,
    momentResultTimer: null,
    floatingCount: 0,
  }

  function escapeHtml(str) {
    return String(str ?? '')
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;')
  }

  function formatNumber(n) {
    return Number(n || 0).toLocaleString('es-AR')
  }

  function showError(text) {
    document.getElementById('errorText').textContent = text
    document.getElementById('errorNotice').classList.remove('hidden')
  }

  // ---------------- Carga inicial ----------------
  async function init() {
    const code = (new URLSearchParams(location.search).get('code') || '').trim().toUpperCase()
    if (!code) {
      showError('Falta el código de la boda en el link (…/projection.html?code=TUCODIGO)')
      return
    }

    const { data: wedding, error } = await sb.from('weddings').select('*')
      .eq('invite_code', code).maybeSingle()
    if (error || !wedding) {
      showError('No encontramos una boda con el código ' + code)
      return
    }
    state.weddingId = wedding.id
    renderHeader(wedding)
    renderCover(wedding)

    await Promise.all([loadPhotos(), loadPoints(), loadMoment()])
    subscribeEmojis()
  }

  function renderHeader(wedding) {
    document.getElementById('names').textContent =
      `${wedding.bride_name || ''} & ${wedding.groom_name || ''}`.toUpperCase()
    // "2026-09-25" → "25 · 09 · 2026"
    const parts = (wedding.date || '').split('-')
    if (parts.length === 3) {
      document.getElementById('date').textContent = `${parts[2]} · ${parts[1]} · ${parts[0]}`
    }
  }

  function renderCover(wedding) {
    const cell = document.getElementById('coverCell')
    if (wedding.cover_photo_url) {
      cell.innerHTML = `<img src="${escapeHtml(wedding.cover_photo_url)}" alt="">`
    } else {
      document.getElementById('coverFallback').textContent =
        `${wedding.bride_name || ''} & ${wedding.groom_name || ''}`
    }
  }

  // ---------------- Mosaico ----------------
  function initSlots() {
    state.slots = SLOT_KEYS.map(key => {
      const el = document.querySelector(`[data-slot="${key}"]`)
      el.insertAdjacentHTML('afterbegin', PLACEHOLDER_HTML)
      return { key, el, photo: null, updatedAt: 0 }
    })
  }

  // Posición a reemplazar: una vacía si hay, si no la que lleva más tiempo sin cambiar
  function pickSlot() {
    const empty = state.slots.find(s => !s.photo)
    if (empty) return empty
    return state.slots.reduce((oldest, s) => s.updatedAt < oldest.updatedAt ? s : oldest)
  }

  function isOnScreen(photoId) {
    return state.slots.some(s => s.photo && s.photo.id === photoId)
  }

  function showInSlot(slot, photo, animate) {
    slot.photo = photo
    slot.updatedAt = Date.now()

    const layer = document.createElement('div')
    layer.className = 'layer'
    layer.innerHTML = `
      <img src="${escapeHtml(photo.url)}" alt="">
      ${photo.guest_name ? `<div class="guest-name">${escapeHtml(photo.guest_name)}</div>` : ''}
    `
    const previous = [...slot.el.querySelectorAll('.layer, .placeholder')]
    // La nueva capa va encima de las anteriores pero debajo de los overlays fijos
    const firstOverlay = slot.el.querySelector('.quote, .votes-badge')
    slot.el.insertBefore(layer, firstOverlay)

    const reveal = () => {
      // Forzar reflow para que la transición arranque desde scale(0.96)
      void layer.offsetWidth
      layer.classList.add('in')
      previous.forEach(old => {
        old.classList.add('out')
        setTimeout(() => old.remove(), LEAVE_MS)
      })
      if (slot.key === 'h') renderSlotHVotes()
    }

    if (!animate) {
      layer.classList.add('in')
      layer.style.transition = 'none'
      previous.forEach(old => old.remove())
      requestAnimationFrame(() => { layer.style.transition = '' })
      if (slot.key === 'h') renderSlotHVotes()
      return
    }
    // Se espera a que la imagen cargue para que no entre un cuadro vacío
    const img = layer.querySelector('img')
    if (img.complete) reveal()
    else {
      img.addEventListener('load', reveal, { once: true })
      img.addEventListener('error', reveal, { once: true })
    }
  }

  function renderSlotHVotes() {
    const slot = state.slots.find(s => s.key === 'h')
    const badge = document.getElementById('slotHVotes')
    if (!slot || !slot.photo) { badge.classList.add('hidden'); return }
    const likes = state.likesById[slot.photo.id] || 0
    badge.textContent = `❤️ ${formatNumber(likes)} ${likes === 1 ? 'voto' : 'votos'}`
    badge.classList.remove('hidden')
  }

  // Rotación suave: la posición más vieja pasa a la siguiente foto que no esté en pantalla
  function rotateNext() {
    if (document.body.classList.contains('moment-on')) return
    const { pool } = state
    if (pool.length <= state.slots.filter(s => s.photo).length) return
    for (let i = 0; i < pool.length; i++) {
      const photo = pool[(state.poolCursor + i) % pool.length]
      if (isOnScreen(photo.id)) continue
      state.poolCursor = (state.poolCursor + i + 1) % pool.length
      showInSlot(pickSlot(), photo, true)
      return
    }
  }

  async function loadPhotos() {
    const [{ data: recent }, { data: all }] = await Promise.all([
      sb.from('photos').select('*')
        .eq('wedding_id', state.weddingId).eq('status', 'approved')
        .order('created_at', { ascending: false })
        .limit(POOL_SIZE),
      sb.from('photos').select('id, likes')
        .eq('wedding_id', state.weddingId).eq('status', 'approved'),
    ])
    state.pool = recent || []
    ;(all || []).forEach(p => { state.likesById[p.id] = p.likes || 0 })
    state.totalPhotos = (all || []).length
    renderFooter()

    state.pool.slice(0, state.slots.length).forEach((photo, i) => {
      showInSlot(state.slots[i], photo, false)
      // Escalonado: la primera posición es la primera en rotar
      state.slots[i].updatedAt = Date.now() - (state.slots.length - i) * 1000
    })
    state.poolCursor = Math.min(state.pool.length, state.slots.length) % Math.max(state.pool.length, 1)
    clearInterval(state.rotateTimer)
    state.rotateTimer = setInterval(rotateNext, ROTATE_MS)

    await sb.removeChannel(sb.channel('projection-web-photos'))
    sb.channel('projection-web-photos')
      .on('postgres_changes', {
        event: 'INSERT', schema: 'public', table: 'photos',
        filter: `wedding_id=eq.${state.weddingId}`
      }, (payload) => {
        const photo = payload.new
        if (photo.status !== 'approved' || photo.id in state.likesById) return
        state.likesById[photo.id] = photo.likes || 0
        state.totalPhotos += 1
        state.pool = [photo, ...state.pool].slice(0, POOL_SIZE)
        renderFooter()
        showInSlot(pickSlot(), photo, true)
      })
      .on('postgres_changes', {
        event: 'UPDATE', schema: 'public', table: 'photos',
        filter: `wedding_id=eq.${state.weddingId}`
      }, (payload) => {
        const photo = payload.new
        if (!(photo.id in state.likesById)) return
        state.likesById[photo.id] = photo.likes || 0
        renderFooter()
        renderSlotHVotes()
      })
      .subscribe()
  }

  function totalVotes() {
    return Object.values(state.likesById).reduce((sum, n) => sum + n, 0)
  }

  function renderFooter() {
    const photos = state.totalPhotos
    const votes = totalVotes()
    document.getElementById('footerPhotos').textContent =
      `📷 ${formatNumber(photos)} ${photos === 1 ? 'foto' : 'fotos'}`
    document.getElementById('footerVotes').textContent =
      `❤️ ${formatNumber(votes)} ${votes === 1 ? 'voto' : 'votos'}`
    document.getElementById('starVotes').textContent = formatNumber(votes)
  }

  // ---------------- Estrella de la noche (top 1 por mesa) ----------------
  async function loadPoints() {
    const { data } = await sb.from('points')
      .select('guest_name, table_name, points')
      .eq('wedding_id', state.weddingId)
    state.pointsRows = data || []
    renderStar()

    await sb.removeChannel(sb.channel('projection-web-points'))
    sb.channel('projection-web-points')
      .on('postgres_changes', {
        event: 'INSERT', schema: 'public', table: 'points',
        filter: `wedding_id=eq.${state.weddingId}`
      }, (payload) => {
        const row = payload.new
        state.pointsRows.push({
          guest_name: row.guest_name,
          table_name: row.table_name ?? null,
          points: row.points,
        })
        renderStar()
      })
      .subscribe()
  }

  // Las mesas se agrupan sin distinguir mayúsculas ("mesa 5" = "Mesa 5")
  function tableLabel(name) {
    if (name === NO_TABLE || /^mesa\b/i.test(name)) return name
    return 'Mesa ' + name
  }

  function renderStar() {
    const totals = {}
    state.pointsRows.forEach(row => {
      const name = (row.table_name || '').trim() || NO_TABLE
      const key = name.toLowerCase()
      if (!totals[key]) totals[key] = { name, points: 0 }
      totals[key].points += row.points || 0
    })
    const top = Object.values(totals).sort((a, b) => b.points - a.points)[0]
    document.getElementById('starName').textContent = top ? tableLabel(top.name) : '—'
    document.getElementById('starPoints').textContent =
      top ? `${formatNumber(top.points)} pts` : 'Sumá puntos jugando'
  }

  // ---------------- Foto del momento ----------------
  async function loadMoment() {
    const { data: sess } = await sb.from('photo_moment_sessions').select('*')
      .eq('wedding_id', state.weddingId)
      .order('created_at', { ascending: false }).limit(1).maybeSingle()
    if (sess && sess.status === 'active') handleMomentSession(sess)

    await sb.removeChannel(sb.channel('projection-web-moment'))
    sb.channel('projection-web-moment')
      .on('postgres_changes', {
        event: '*', schema: 'public', table: 'photo_moment_sessions',
        filter: `wedding_id=eq.${state.weddingId}`
      }, (payload) => handleMomentSession(payload.new))
      .subscribe()
  }

  async function loadMomentVotes(photoId) {
    const { data } = await sb.from('photo_votes').select('vote')
      .eq('wedding_id', state.weddingId).eq('photo_id', photoId)
    const count = { likes: 0, mehs: 0 }
    ;(data || []).forEach(v => {
      if (v.vote === 'like') count.likes++
      else if (v.vote === 'meh') count.mehs++
    })
    // Solo si la sesión sigue siendo la que se muestra
    if (state.moment && state.moment.photo_id === photoId) {
      state.momentVotes = count
      renderMoment()
    }
  }

  async function handleMomentSession(sess) {
    if (!sess || !sess.id) return
    const current = state.moment

    if (sess.status === 'active') {
      if (current && current.id === sess.id) return
      clearTimeout(state.momentResultTimer)
      state.moment = sess
      state.momentPhoto = null
      state.momentVotes = { likes: 0, mehs: 0 }
      document.getElementById('momentPhoto').removeAttribute('src')
      renderMoment()
      startMomentCountdown()
      document.body.classList.add('moment-on')

      const { data: photo } = await sb.from('photos').select('*').eq('id', sess.photo_id).maybeSingle()
      if (!state.moment || state.moment.id !== sess.id) return
      state.momentPhoto = photo || null
      if (photo) document.getElementById('momentPhoto').src = photo.url
      await loadMomentVotes(sess.photo_id)

      await sb.removeChannel(sb.channel('projection-web-moment-votes'))
      sb.channel('projection-web-moment-votes')
        .on('postgres_changes', {
          event: 'INSERT', schema: 'public', table: 'photo_votes',
          filter: `photo_id=eq.${sess.photo_id}`
        }, () => loadMomentVotes(sess.photo_id))
        .subscribe()
      return
    }

    // Terminó la sesión que se está mostrando: resultado 5s y vuelta al mosaico
    if (sess.status === 'ended' && current && current.id === sess.id) {
      state.moment = sess
      clearInterval(state.momentTimer)
      await loadMomentVotes(sess.photo_id)
      await sb.removeChannel(sb.channel('projection-web-moment-votes'))
      renderMoment()
      clearTimeout(state.momentResultTimer)
      state.momentResultTimer = setTimeout(() => {
        document.body.classList.remove('moment-on')
        setTimeout(() => {
          // Si mientras tanto arrancó otra ronda, no se pisa
          if (!state.moment || state.moment.id !== sess.id) return
          state.moment = null
          state.momentPhoto = null
        }, MOMENT_FADE_MS)
      }, MOMENT_RESULT_MS)
    }
  }

  function momentSecondsLeft() {
    const sess = state.moment
    if (!sess || !sess.started_at) return MOMENT_SECONDS
    const elapsed = (Date.now() - new Date(sess.started_at).getTime()) / 1000
    return Math.max(0, Math.ceil(MOMENT_SECONDS - elapsed))
  }

  function startMomentCountdown() {
    clearInterval(state.momentTimer)
    const el = document.getElementById('momentCountdown')
    el.textContent = momentSecondsLeft()
    state.momentTimer = setInterval(() => {
      const left = momentSecondsLeft()
      el.textContent = left
      if (left <= 0) clearInterval(state.momentTimer)
    }, 250)
  }

  function renderMoment() {
    const sess = state.moment
    if (!sess) return
    const { likes, mehs } = state.momentVotes
    const total = likes + mehs
    const likePct = total > 0 ? Math.round(likes / total * 100) : 0
    const mehPct = total > 0 ? 100 - likePct : 0
    const ended = sess.status === 'ended'
    const won = ended && likePct > MOMENT_WIN_THRESHOLD
    const author = (state.momentPhoto && state.momentPhoto.guest_name) || 'un invitado'

    document.getElementById('likeFill').style.width = likePct + '%'
    document.getElementById('mehFill').style.width = mehPct + '%'
    document.getElementById('likeValue').textContent = `${likePct}% · ${likes}`
    document.getElementById('mehValue').textContent = `${mehPct}% · ${mehs}`
    document.getElementById('momentTotal').textContent =
      `${total} ${total === 1 ? 'voto recibido' : 'votos recibidos'}` +
      (won ? `  ·  ¡+${MOMENT_WIN_POINTS} pts para ${author}!` : '')

    document.getElementById('momentEyebrow').textContent =
      ended ? 'Resultado final' : 'Foto del momento · Votá desde tu celular'
    document.getElementById('momentCountdown').classList.toggle('hidden', ended)
    const result = document.getElementById('momentResult')
    result.classList.toggle('hidden', !ended)
    result.textContent = `${won ? '🏆 ' : ''}📸 Foto de ${author}`
  }

  // ---------------- Emojis flotantes ----------------
  async function subscribeEmojis() {
    await sb.removeChannel(sb.channel('projection-web-emojis'))
    sb.channel('projection-web-emojis')
      .on('postgres_changes', {
        event: 'INSERT', schema: 'public', table: 'emoji_reactions',
        filter: `wedding_id=eq.${state.weddingId}`
      }, (payload) => spawnEmoji(payload.new.emoji))
      .subscribe()
  }

  function spawnEmoji(emoji) {
    if (!emoji || state.floatingCount >= MAX_FLOATING_EMOJIS) return
    state.floatingCount++
    const el = document.createElement('div')
    el.className = 'floating-emoji'
    el.textContent = emoji
    el.style.left = Math.random() * Math.max(window.innerWidth - 48, 0) + 'px'
    document.getElementById('emojiLayer').appendChild(el)
    setTimeout(() => {
      el.remove()
      state.floatingCount--
    }, EMOJI_DURATION)
  }

  // ---------------- Arranque ----------------
  initSlots()
  init()
</script>
</body>
</html>
